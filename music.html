        HOW TO ADD A TRACK:
        1. Get the YouTube embed URL, e.g. https://www.youtube.com/embed/VIDEO_ID
        2. Delete the <div class="video-placeholder">...</div> block below.
        3. Uncomment the <iframe> tag and paste your URL into the src attribute.
        4. Update the caption text above it.
        Repeat this whole <div class="video-slot"> block for each track.
      -->

      <div class="video-slot">
        <p class="caption">Track 01 — Title goes here</p>
